<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — ArchHire</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-visual">
    <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=900&q=80" alt="Architecture">
    <div class="auth-visual-text">
      <a href="/" class="nav-logo" style="font-size:1.8rem;color:var(--cream)">Arch<span style="color:var(--gold)">Hire</span></a>
      <h2 style="margin-top:1.5rem">Build something<br>extraordinary.</h2>
      <p>Join as a client to find your architect, or as an architect to grow your studio.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="sub">It takes less than a minute.</p>
      <div class="alert" id="alert"></div>

      <div class="role-toggle">
        <div class="role-opt selected" data-role="customer">
          <div style="font-size:1.3rem">🏠</div>I'm a Client
        </div>
        <div class="role-opt" data-role="architect">
          <div style="font-size:1.3rem">✦</div>I'm an Architect
        </div>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required>
        </div>

        <div id="architect-fields" style="display:none">
          <div class="form-row">
            <div class="form-group"><label>Studio Name</label><input type="text" id="studio" placeholder="Your studio"></div>
            <div class="form-group">
              <label>Specialty</label>
              <select id="specialty">
                <option>Residential</option><option>Commercial</option>
                <option>Interior</option><option>Landscape</option><option>Sustainable</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label>Location</label><input type="text" id="location" placeholder="City, Country"></div>
        </div>

        <button class="btn-primary" type="submit" style="width:100%">Create Account →</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
getCurrentUser().then(u => { if (u) location.href = dashboardFor(u.role); });

let role = 'customer';
document.querySelectorAll('.role-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.role-opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    role = opt.dataset.role;
    document.getElementById('architect-fields').style.display = role === 'architect' ? 'block' : 'none';
  });
});

const alertBox = document.getElementById('alert');
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  alertBox.className = 'alert';
  const body = {
    role,
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  };
  if (role === 'architect') {
    body.studio = document.getElementById('studio').value;
    body.specialty = document.getElementById('specialty').value;
    body.location = document.getElementById('location').value;
  }
  try {
    const { user } = await api('/api/auth/register', { method: 'POST', body });
    location.href = dashboardFor(user.role);
  } catch (err) {
    alertBox.textContent = err.message;
    alertBox.className = 'alert error';
  }
});
</script>
</body>
</html>
